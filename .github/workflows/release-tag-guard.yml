name: Release Tag Guard

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "pubspec.yaml is missing version:"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test
